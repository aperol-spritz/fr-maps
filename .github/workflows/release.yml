name: Release Neverwinter City Map
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Required existing stable tag, for example v0.17.0'
        required: true
        type: string
permissions: {}
concurrency:
  group: module-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate existing stable tag before running its build
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node tools/release/tag.mjs
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - name: Generate release manifest and verified root ZIP
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        run: npm run release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: module-release
          path: |
            dist/module.json
            dist/module.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: module-release
          path: dist
      - name: Create or recover GitHub release and verify public assets
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: node tools/release/publish.mjs --github-only
